<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <title>Generador de sobres</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; padding: 24px; max-width: 700px; margin: auto; text-align: center; background: #f5f6fa; }
    h1 { margin-bottom: 12px; }
    p { margin-bottom: 16px; }
    .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 20px; margin: 20px 0; text-align: center; }
    .card h2 { margin-bottom: 16px; font-size: 20px; color: #333; }
    .row { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 12px 0; }
    label { font-weight: 600; display: block; margin-bottom: 4px; }
    select, input[type="number"] { width: 200px; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; text-align: center; }
    .status { margin: 20px 0; font-weight: 600; font-size: 18px; }
    .actions { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 16px; }
    button { padding: 12px 20px; font-size: 16px; font-weight: 600; cursor: pointer; border: none; border-radius: 8px; background: #0078d7; color: white; transition: background 0.2s ease; }
    button:hover:enabled { background: #005ea6; }
    button:disabled { background: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>SCR - Massive Booster Pack Generator - Sealed</h1>
  <p>Each player has exactly <strong>9 booster packs</strong>.</p>

  <!-- STEP 1: Packs -->
  <div class="card">
    <h2>Step 1: Choose Packs</h2>
    <div class="row">
      <label for="betaPacks">Beta packs (per player)</label>
      <input id="betaPacks" type="number" min="0" max="9" value="2" />
    </div>
    <div class="row">
      <label for="alPacks">AL packs (per player)</label>
      <input id="alPacks" type="number" min="0" max="9" value="2" />
    </div>
    <div class="row">
      <label for="gothicPacks">Gothic packs (per player)</label>
      <input id="gothicPacks" type="number" min="0" max="9" value="2" />
    </div>
  </div>

  <!-- STEP 1b: DragonLord -->
  <div class="card">
    <h2>Optional: Add DragonLord Pack</h2>
    <div class="row">
      <label>
        <input id="dlCheck" type="checkbox" /> Add DragonLord Pack
      </label>
    </div>
  </div>

  <!-- STEP 2: Players -->
  <div class="card">
    <h2>Step 2: Players</h2>
    <div class="row">
      <label for="jugadors">Players</label>
      <select id="jugadors">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </div>
  </div>

  <!-- STEP 3: Download -->
  <div class="card">
    <h2>Step 3: Download</h2>
    <div id="status" class="status"></div>
    <div class="actions">
      <button id="exportXlsxBtn" disabled>⬇️ Download XLSX</button>
    </div>
  </div>

<script>
  const betaEl = document.getElementById('betaPacks');
  const alEl = document.getElementById('alPacks');
  const gothEl = document.getElementById('gothicPacks');
  const dlEl = document.getElementById('dlCheck');
  const statusEl = document.getElementById('status');
  const exportBtn = document.getElementById('exportXlsxBtn');
  const jugadorsEl = document.getElementById('jugadors');

  function updateStatus() {
    const b = parseInt(betaEl.value)||0;
    const a = parseInt(alEl.value)||0;
    const g = parseInt(gothEl.value)||0;
    const dl = dlEl.checked ? 1 : 0;
    const total = b + a + g;

    const required = dl ? 5 : 6;

    if (total !== required) {
      statusEl.textContent = `❌ Total packs must be exactly ${required}. Currently: ${total}`;
      statusEl.style.color = 'red';
      exportBtn.disabled = true;
    } else {
      statusEl.textContent = `✅ Packs OK: ${b} Beta + ${a} AL + ${g} Gothic` + (dl ? " + DragonLord" : "");
      statusEl.style.color = 'green';
      exportBtn.disabled = false;
    }
  }

  betaEl.addEventListener('input', updateStatus);
  alEl.addEventListener('input', updateStatus);
  gothEl.addEventListener('input', updateStatus);
  dlEl.addEventListener('change', updateStatus);
  updateStatus();

  exportBtn.addEventListener('click', () => {
    const j = parseInt(jugadorsEl.value);
    const b = parseInt(betaEl.value);
    const a = parseInt(alEl.value);
    const g = parseInt(gothEl.value);
    const dl = dlEl.checked ? 1 : 0;

    window.location.href = `/export_xlsx/${j}/${b}/${a}/${g}/${dl}`;
  });
</script>

</body>
</html>
